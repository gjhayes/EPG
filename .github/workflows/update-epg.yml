name: Update EPG Data

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (runs on the default branch)
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Force re-download all sources (bypass ETag cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      allow_drop:
        description: 'Publish even if the programme count collapsed vs the last deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: epg-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Restore EPG source cache
        uses: actions/cache/restore@v4
        id: epg-cache
        with:
          path: scripts/.cache
          key: epg-sources-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epg-sources-v1-${{ runner.os }}-

      - name: Fetch metadata from the last deploy (for the sanity gate)
        run: curl -fsS -m 30 https://gjhayes.github.io/EPG/metadata.json -o previous-metadata.json || echo "no previous metadata — drop check skipped"

      - name: Run EPG aggregator
        run: |
          python scripts/merge_epg.py \
            --config config/sources.yaml \
            --channel-map config/channel_map.yaml \
            --output-dir ./output \
            --cache-dir scripts/.cache \
            --previous-metadata previous-metadata.json \
            --log-level INFO
        env:
          FORCE_DOWNLOAD: ${{ inputs.force_download }}
          ALLOW_DROP: ${{ inputs.allow_drop }}
          # Only used if the (currently disabled) xtream_provider source is
          # re-enabled in config/sources.yaml. Its URL is redacted from logs.
          XTREAM_EPG_URL: ${{ secrets.XTREAM_EPG_URL }}

      - name: Save EPG source cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/.cache
          key: epg-sources-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Decompress smaller EPG files for apps that don't support gzip
        run: |
          cd output
          # GitHub rejects any single file over 100MB. Keep plain XML only for
          # files that stay under the limit; large ones remain gzip-only.
          LIMIT=$((95 * 1024 * 1024))
          for f in *.xml.gz; do
            [ -f "$f" ] || continue
            plain="${f%.gz}"
            gzip -dk "$f"
            sz=$(stat -c%s "$plain")
            if [ "$sz" -gt "$LIMIT" ]; then
              echo "Removing $plain ($sz bytes) — exceeds 100MB limit; keeping gzip only"
              rm -f "$plain"
            fi
          done
          # Publish common name aliases so apps using non-ISO codes still work
          [ -f epg_GB.xml.gz ] && cp epg_GB.xml.gz epg_UK.xml.gz
          [ -f epg_GB.xml ]    && cp epg_GB.xml    epg_UK.xml
          echo "Published files:"; ls -lh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: 'chore: auto-update EPG data [skip ci]'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: false
          # Replace gh-pages with a single fresh commit each run. Without this
          # every 6-hourly deploy added ~50MB of new blobs to history (the repo
          # reached 26GB after ~530 runs).
          force_orphan: true

sources:

  # ── Provider EPG (DISABLED) ────────────────────────────────────────────────
  # The strong8k Xtream EPG is accurate and uses the M3U's dotted channel IDs,
  # but the provider blocks GitHub's runner IPs (it returns an empty 200), so
  # this source has failed on every hosted run. Add the provider EPG directly in
  # TiviMate instead and rank it above this feed. Re-enable only on a runner the
  # provider doesn't block (e.g. a self-hosted runner at home); the URL comes
  # from the XTREAM_EPG_URL secret and is redacted from logs/metadata.
  - id: xtream_provider
    name: "Provider Xtream EPG"
    url: "${XTREAM_EPG_URL}"
    country: ALL
    multi_country: true
    priority: 1
    enabled: false
    timeout: 180
    retry: 2
    time_shift_hours: 0
    user_agent: "VLC/3.0.20 LibVLC/3.0.20"

  # ── epg.pw ─────────────────────────────────────────────────────────────────
  # epg.pw stamps every programme "+0000" but the times are really UTC+8 (China
  # time, no DST), so every feed needs −8 h. Verified against fixed-time anchors
  # (BBC News 18:00 UK, ABC News 19:00 Sydney) — see offset_checks below, which
  # re-verify this on every build.

  - id: epg_pw_au
    name: "epg.pw Australia"
    url: "https://epg.pw/xmltv/epg_AU.xml"
    country: AU
    priority: 2
    enabled: true
    timeout: 120
    retry: 3
    time_shift_hours: -8

  - id: epg_pw_gb
    name: "epg.pw United Kingdom"
    url: "https://epg.pw/xmltv/epg_GB.xml"
    country: GB
    priority: 2
    enabled: true
    timeout: 120
    retry: 3
    time_shift_hours: -8
    # epg.pw's 5-digit 12xxx IDs (Sky, E4, More4, BBC regions, CNBC, GB News…)
    # are converted to UTC+8 twice, so they need a further −8 h (−16 h total).
    # They only exist in the GB feed; US/CA aliases pointing at them get their
    # data from here. Explicit per_channel_shifts: {id: hours} entries, if
    # added, take precedence over patterns.
    per_channel_shift_patterns:
      - pattern: '12\d{3}'
        hours: -8

  - id: epg_pw_us
    name: "epg.pw United States"
    url: "https://epg.pw/xmltv/epg_US.xml"
    country: US
    priority: 2
    enabled: true
    timeout: 300
    retry: 3
    time_shift_hours: -8

  - id: epg_pw_ca
    name: "epg.pw Canada"
    url: "https://epg.pw/xmltv/epg_CA.xml"
    country: CA
    priority: 2
    enabled: true
    timeout: 120
    retry: 3
    time_shift_hours: -8

  # Tried and disabled — each returned an HTML page instead of XMLTV (HTTP 200):
  #   xmltv.net  Australia / United_Kingdom / United_States / Canada
  #   epg.pw     IT, ES, HU, RS, HR, GR, ME
  #   rytec_hu   github.com/sunsettrack4/schedule_sources (hu_epg.xml)
  # Candidates to evaluate: iptv-org guides for IT/ES.

output:
  combined_filename: epg.xml.gz
  # Only the channels referenced by channel_map.yaml (+ manual overlay) — about
  # 5% of the combined feed, so TiviMate refreshes far faster.
  slim_filename: epg_slim.xml.gz
  per_country: true
  compress: true
  compress_level: 9

cache:
  dir: scripts/.cache
  use_conditional_get: true

settings:
  parallel_downloads: 3
  retry_delay_seconds: 30
  user_agent: "EPG-Aggregator/1.0 (+https://github.com/gjhayes/EPG)"
  # Drop programmes that finished more than this many hours ago.
  prune_ended_hours: 6
  # Deploy gate: refuse to publish if the combined feed is below this floor or
  # fell by more than max_programme_drop versus the last deploy.
  min_combined_programmes: 50000
  max_programme_drop: 0.5

# Programmes that always start at a fixed local time. After shifting, at least
# one matching programme in the feed window must land on local_time, otherwise
# the build emits a warning (Actions annotation + status page). Weekday-only
# programmes are fine: every 3-day window contains a weekday.
offset_checks:
  - name: "GB base batch — BBC One: BBC News 18:00 UK"
    source: epg_pw_gb
    channel: "486807"
    title_contains: "BBC News"
    local_time: "18:00"
    timezone: Europe/London
  - name: "GB 12xxx batch — BBC One London: BBC News 18:00 UK"
    source: epg_pw_gb
    channel: "12385"
    title_contains: "BBC News"
    local_time: "18:00"
    timezone: Europe/London
  - name: "GB 12xxx batch — CNBC: Squawk on the Street 09:00 ET"
    source: epg_pw_gb
    channel: "12291"
    title_contains: "Squawk on the Street"
    local_time: "09:00"
    timezone: America/New_York
  - name: "AU — ABC TV: ABC News 19:00 Sydney"
    source: epg_pw_au
    channel: "3357"
    title_contains: "ABC News"
    local_time: "19:00"
    timezone: Australia/Sydney
  - name: "US — CNBC: Squawk on the Street 09:00 ET"
    source: epg_pw_us
    channel: "464791"
    title_contains: "Squawk on the Street"
    local_time: "09:00"
    timezone: America/New_York
